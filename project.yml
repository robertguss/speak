name: Speak

options:
  bundleIdPrefix: com.robertguss.speak
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 34SDRG9ZZ2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  DictationCore:
    path: Packages/DictationCore

targets:
  SpeakMac:
    type: application
    platform: macOS
    sources: [Apps/Mac]
    dependencies:
      - package: DictationCore
        products: [DictationCore, DictationUI]
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Speak
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Speak records your voice while you hold or tap the dictation key, then sends the clip to your chosen transcription provider.
        DictationKeychainAccessGroup: $(AppIdentifierPrefix)com.robertguss.speak.shared
    entitlements:
      path: Apps/Mac/Mac.entitlements
      properties:
        com.apple.security.device.audio-input: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.robertguss.speak.shared
    settings:
      base:
        PRODUCT_NAME: Speak
        PRODUCT_BUNDLE_IDENTIFIER: com.robertguss.speak.mac
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO

  MacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Apps/MacTests]
    dependencies:
      - target: SpeakMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertguss.speak.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Speak.app/Contents/MacOS/Speak
        BUNDLE_LOADER: $(TEST_HOST)

  SpeakiOS:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    dependencies:
      - package: DictationCore
        products: [DictationCore, DictationUI]
      - target: SpeakKeyboard
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Speak
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: Speak records your voice when you tap the mic in the Speak keyboard, then sends the clip to your chosen transcription provider.
        CFBundleURLTypes:
          - CFBundleURLName: com.robertguss.speak
            CFBundleURLSchemes: [speak]
        DictationKeychainAccessGroup: $(AppIdentifierPrefix)com.robertguss.speak.shared
    entitlements:
      path: Apps/iOS/iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.robertguss.speak
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.robertguss.speak.shared
    settings:
      base:
        PRODUCT_NAME: Speak
        PRODUCT_BUNDLE_IDENTIFIER: com.robertguss.speak.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  SpeakKeyboard:
    type: app-extension
    platform: iOS
    sources: [Apps/Keyboard]
    dependencies:
      - package: DictationCore
        products: [DictationCore]
    info:
      path: Apps/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Speak
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Apps/Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.robertguss.speak
    settings:
      base:
        PRODUCT_NAME: SpeakKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: com.robertguss.speak.ios.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  SpeakMac:
    build:
      targets:
        SpeakMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MacTests]
  SpeakiOS:
    build:
      targets:
        SpeakiOS: all
        SpeakKeyboard: all
    run:
      config: Debug
  SpeakKeyboard:
    build:
      targets:
        SpeakKeyboard: all
        SpeakiOS: all
    run:
      config: Debug
